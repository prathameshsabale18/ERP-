name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
           node-version: '22.x'
         cache: 'npm'
      - name: Verify Node
        run: |
           node -v
           npm -v
         

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix content permissions
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Android APK
        uses: gradle/gradle-build-action@v3
        with:
          project-subdirectory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
